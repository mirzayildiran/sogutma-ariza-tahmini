name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-api.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-api.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: İmajı derle
        run: docker build -t sogutma-ariza-tahmini .

      - name: API duman testi
        run: |
          docker run -d --name api -p 8000:8000 sogutma-ariza-tahmini
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/saglik && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/saglik
          curl -sf -F "dosya=@examples/ornek_veri.csv" http://127.0.0.1:8000/tahmin/csv \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, ensure_ascii=False)[:400])"

      - name: Panel duman testi
        run: |
          docker run -d --name panel -p 8501:8501 sogutma-ariza-tahmini \
            streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8501/_stcore/health

      - name: Kapsayıcı günlükleri
        if: always()
        run: docker logs api || true; docker logs panel || true
